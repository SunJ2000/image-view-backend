name: image-view
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-image_view}
      MYSQL_USER: ${DB_USERNAME:-image_view}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run npm run setup:local first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      [
        '--character-set-server=utf8mb4',
        '--collation-server=utf8mb4_unicode_ci',
      ]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
  backend:
    profiles: ['production']
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: '3306'
      PORT: '3000'
      ENABLE_SWAGGER: 'false'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      mysql: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
volumes:
  mysql_data:
